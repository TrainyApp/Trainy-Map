<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trainy Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" 
  />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    #status {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.92);
      padding: 8px 14px;
      border-radius: 6px;
      font: 14px -apple-system, system-ui, sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      max-width: 80vw;
    }
    #status.hidden { display: none; }
    #status.error { background: #fde2e1; color: #8a1f1b; }
    @media (prefers-color-scheme: dark) {
      #status { background: rgba(30, 30, 30, 0.92); color: #eee; }
      #status.error { background: #4a1a18; color: #ffb4b1; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Loading…</div>

  <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    function showStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
      statusEl.classList.remove('hidden');
    }
    function hideStatus() {
      statusEl.classList.add('hidden');
    }

    const themes = {
      dark:  { base: 'dark_all',  polyline: '#e6332a' },
      light: { base: 'light_all', polyline: '#e6332a' },
    };
    const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
    function currentTheme() { return darkMq.matches ? themes.dark : themes.light; }

    const cartoAttribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
    const ormAttribution = '&copy; <a href="https://www.openrailwaymap.org/">OpenRailwayMap</a>';
    
    function basemapTiles(base) {
      return ['a', 'b', 'c', 'd'].map(s =>
        `https://${s}.basemaps.cartocdn.com/${base}/{z}/{x}/{y}.png`
      );
    }

    const map = new maplibregl.Map({
      container: 'map',
      style: { version: 8, sources: {}, layers: [] },
      center: [0, 20],
      zoom: 2,
      maxZoom: 19,
    });

    function addBasemap() {
      const t = currentTheme();
      map.addSource('basemap', {
        type: 'raster',
        tiles: basemapTiles(t.base),
        tileSize: 256,
        attribution: cartoAttribution,
      });
      const before = map.getLayer('orm') ? 'orm' : undefined;
      map.addLayer({ id: 'basemap', type: 'raster', source: 'basemap' }, before);
    }

    function applyTheme() {
      const t = currentTheme();
      if (map.getLayer('basemap')) map.removeLayer('basemap');
      if (map.getSource('basemap')) map.removeSource('basemap');
      addBasemap();
      if (map.getLayer('route')) {
        map.setPaintProperty('route', 'line-color', t.polyline);
      }
    }

    map.on('load', () => {
      addBasemap();

      map.addSource('orm', {
        type: 'raster',
        tiles: [`https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png`],
        tileSize: 256,
        attribution: ormAttribution,
      });
      map.addLayer({
        id: 'orm',
        type: 'raster',
        source: 'orm',
        paint: { 'raster-opacity': 0.3 },
      });

      darkMq.addEventListener('change', applyTheme);
      loadRoute();
    });

    const searchParams = new URLSearchParams(location.search);
    const pathMatch = location.pathname.match(/^\/([^/]+)\/?$/);
    const id = pathMatch ? decodeURIComponent(pathMatch[1]) : searchParams.get('id');

    async function resolveUsername(username) {
      const r = await fetch(`https://rbc.trainy.app/v4/users/search?query=${encodeURIComponent(username)}`);
      if (!r.ok) throw new Error(`User search: ${r.status} ${r.statusText}`);
      const users = await r.json();
      const match = users.find(u => u.username.toLowerCase() === username.toLowerCase()) || users[0];
      if (!match) throw new Error(`No user found for @${username}`);
      return match._id;
    }

    async function resolveUrl(id) {
      const url = new URL(
        id
          ? `https://rbc.trainy.app/v1/users/${encodeURIComponent(id.startsWith('@') ? await resolveUsername(id.slice(1)) : id)}/polyline`
          : 'https://rbc.trainy.app/v1/feeds/polyline?freedType=global'
      );
      if (searchParams.has('requireQuality')) {
        url.searchParams.set('requireQuality', searchParams.get('requireQuality'));
      }
      return url.toString();
    }

    function geojsonBounds(geojson) {
      const bounds = new maplibregl.LngLatBounds();
      let any = false;
      const extend = (coord) => {
        if (typeof coord[0] === 'number' && typeof coord[1] === 'number') {
          bounds.extend(coord);
          any = true;
        } else {
          for (const c of coord) extend(c);
        }
      };
      const geoms = (g) => {
        if (!g) return;
        if (g.type === 'GeometryCollection') g.geometries.forEach(geoms);
        else if (g.coordinates) extend(g.coordinates);
      };
      if (geojson.type === 'FeatureCollection') geojson.features.forEach(f => geoms(f.geometry));
      else if (geojson.type === 'Feature') geoms(geojson.geometry);
      else geoms(geojson);
      return any ? bounds : null;
    }

    async function loadRoute() {
      try {
        const url = await resolveUrl(id);
        const r = await fetch(url);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const geojson = await r.json();
        const t = currentTheme();
        map.addSource('route', { type: 'geojson', data: geojson });
        map.addLayer({
          id: 'route',
          type: 'line',
          source: 'route',
          paint: { 'line-color': t.polyline, 'line-width': 2 },
        });
        const bounds = geojsonBounds(geojson);
        if (bounds) map.fitBounds(bounds, { padding: 20, animate: true });
        hideStatus();
      } catch (err) {
        showStatus(`Failed to load: ${err.message}`, true);
      }
    }
  </script>
</body>
</html>
